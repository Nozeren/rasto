<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Rasto: a trail through passed checkpoints (the steps) to the recording dot. macOS icon grid: 824 px body with a soft shadow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f3a"/>
      <stop offset="1" stop-color="#12141a"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ff7a6e"/>
      <stop offset="0.55" stop-color="#ff3b30"/>
      <stop offset="1" stop-color="#d1241b"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- The trail. -->
  <path d="M228 792 C384 792, 306 597, 461 597 S539 423, 656 403" fill="none" stroke="#ffffff" stroke-opacity="0.55"
        stroke-width="23" stroke-linecap="round" stroke-dasharray="4 50"/>

  <!-- Checkpoints: the steps passed on the way. -->
  <circle cx="228" cy="792" r="47" fill="#ffffff"/>
  <circle cx="461" cy="597" r="47" fill="#ffffff"/>
  <path d="M207 792 l16 16 l29 -31 M440 597 l16 16 l29 -31" fill="none" stroke="#2b2f3a" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The recording dot. -->
  <circle cx="675" cy="395" r="140" fill="#ff3b30" fill-opacity="0.25" filter="url(#glow)"/>
  <circle cx="675" cy="395" r="120" fill="url(#dot)"/>
  <circle cx="675" cy="395" r="120" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="14"/>
</svg>
