<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Rasto: a recording dot leaving a trail ("rasto"). macOS icon grid: 824 px body with a soft shadow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f3a"/>
      <stop offset="1" stop-color="#12141a"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ff7a6e"/>
      <stop offset="0.55" stop-color="#ff3b30"/>
      <stop offset="1" stop-color="#d1241b"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- The trail: fading steps leading to the dot. -->
  <circle cx="248" cy="742" r="22" fill="#ff3b30" fill-opacity="0.22"/>
  <circle cx="338" cy="690" r="30" fill="#ff3b30" fill-opacity="0.38"/>
  <circle cx="440" cy="626" r="40" fill="#ff3b30" fill-opacity="0.6"/>

  <!-- The recording dot. -->
  <circle cx="626" cy="452" r="152" fill="#ff3b30" fill-opacity="0.25" filter="url(#glow)"/>
  <circle cx="626" cy="452" r="132" fill="url(#dot)"/>
  <circle cx="626" cy="452" r="132" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="14"/>
</svg>
